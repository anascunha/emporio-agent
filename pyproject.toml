[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer-service agent for Empório da Música (Artefact AI Engineer technical challenge)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "ollama>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
